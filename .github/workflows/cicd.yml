name: CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'Module10/LabExercises/Exercise02/**'
      - '.github/workflows/cicd.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install
      working-directory: ./Module10/LabExercises/Exercise02/calculator

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: ./Module10/LabExercises/Exercise02/calculator
        file: ./Module10/LabExercises/Exercise02/calculator/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/calculator:latest

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
