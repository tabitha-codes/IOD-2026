<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Chat App</title>
</head>

<body>
    <h2>Welcome to Socket Chat</h2>

    <!-- where messages appear, and the form to send one -->
    <ul id="messages"></ul>
    <form id="form">
        <input id="input" autocomplete="off" />
        <button>Send</button>
    </form>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = io();
        let form = document.getElementById('form');
        let input = document.getElementById('input');
        let messages = document.getElementById('messages');

          // ask for a nickname once ("Anonymous" if they cancel or leave it blank)
    let nickname = prompt('Choose a nickname:') || 'Anonymous';

      // send the nickname every time the connection opens
    socket.on('connect', () => {
      socket.emit('join', nickname);
    });

        // adds one line to the message list
        // textContent (not innerHTML) stops people from injecting HTML into the page
        function addMessage(text) {
            let item = document.createElement('li');
            item.textContent = text;
            messages.appendChild(item);
        }

        // send a message when the form is submitted
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // stops the page from reloading
            let text = input.value.trim();
            if (input.value) {
                socket.emit('chat message', input.value);
                addMessage(`You: ${text}`); // show my own message instantly
                input.value = '';
            }
        });

        // show messages from the server on the page instead of the console
        socket.on('chat message', (msg) => addMessage(msg));
        socket.on('system message', (msg) => addMessage(msg));
        socket.on('connection', msg => console.log(msg))
    </script>
</body>

</html>
