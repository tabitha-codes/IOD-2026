<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Placeholder Posts</title>
    <!-- Bootstrap CSS (that's all cards + grid need — no JS bundle required) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- template: markup for ONE post card, wrapped in a grid column -->
    <template id="post-template">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                </div>
            </div>
        </div>
    </template>

    <!-- container: the responsive row that holds all the cards -->
    <div class="container my-4">
        <div id="post-list" class="row g-3"></div>
    </div>

    <script>

        function addPost(post) {
            const clone = document.getElementById("post-template").content.cloneNode(true);
            clone.querySelector(".card-title").innerText = post.title;
            clone.querySelector(".card-text").innerText = post.body;
            document.getElementById("post-list").appendChild(clone);
        }

        // GET is the default method, so plain fetch(url) is enough
        fetch('https://jsonplaceholder.typicode.com/posts?_limit=10')
            .then((response) => response.json())
            .then((posts) => posts.forEach((post) => addPost(post)));

    </script>

</body>

</html>
