<!-- cards.html -->

<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e3f2fd;
        }

        .card {
            padding: 10px;
        }

        .card-title {
            font-weight: 600;
            font-size: 3em;
            padding: 0 0 10px 0;
        }

        .card-text {
            font-weight: 400;
            font-size: 2em;
        }

        .portfolio-item img {
            max-width: 300px;
            display: block;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <!-- template for Exercise 1 & 2 cards -->
    <template id="card-template">
        <div class="card">
            <div class="card-body">
                <div class="card-title"></div>
                <div class="card-text"></div>
            </div>
        </div>
    </template>

    <!-- template for the artist (Exercise 3) -->
    <template id="artist-template">
        <div class="card">
            <div class="card-body">
                <div class="card-title"></div>
                <div class="portfolio-list"></div>
            </div>
        </div>
    </template>

    <!-- template for one portfolio item (Exercise 3) -->
    <template id="portfolio-template">
        <div class="portfolio-item">
            <div class="portfolio-title"></div>
            <img class="portfolio-img" src="" alt="">
        </div>
    </template>

    <div id="card-list"></div>
    <div id="artist-list"></div>

    <script>
        // ================== Exercise 1: dynamic addCard ==================
        // title and text are now parameters, so the caller decides
        // what each card says
        function addCard(title, text) {
            const template = document.getElementById("card-template")
                .content.cloneNode(true);
            template.querySelector('.card-title').innerText = title;
            template.querySelector('.card-text').innerText = text;
            document.querySelector('#card-list').appendChild(template);
        }

        // ================== Exercise 2: array of people ==================
        const data = [{ name: 'bob', age: 23 }, { name: 'alice', age: 39 }];

        data.forEach(function (person) {
            addCard(person.name, 'Age: ' + person.age);
        });

        // ================== Exercise 3: artist portfolio ==================
        const artist = {
            name: "Van Gogh",
            portfolio: [
                { title: "portrait", url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image" },
                { title: "sky", url: "https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg" },
            ]
        };

        function addArtist(artist) {
            // clone the artist template
            const artistTemplate = document.getElementById("artist-template")
                .content.cloneNode(true);

            // artist name
            artistTemplate.querySelector('.card-title').innerText = artist.name;

            // grab the container inside this artist's card for the portfolio items
            const portfolioList = artistTemplate.querySelector('.portfolio-list');

            // loop over the portfolio and add each item
            artist.portfolio.forEach(function (item) {
                const itemTemplate = document.getElementById("portfolio-template")
                    .content.cloneNode(true);
                itemTemplate.querySelector('.portfolio-title').innerText = item.title;
                itemTemplate.querySelector('.portfolio-img').src = item.url;
                portfolioList.appendChild(itemTemplate);
            });

            document.querySelector('#artist-list').appendChild(artistTemplate);
        }

        addArtist(artist);
    </script>
</body>

</html>
