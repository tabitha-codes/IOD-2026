Part 1 - Use the following array to populate a web page
which contains news. When the page loads up, it should
display all of the news items in the array.
Use an interval function to read the array every 5 seconds.
Every time the array is read, remove all news elements
from the news container and fill it in with the latest news –

Lab #5: Manage Data 2

This time you will need to add news to the previous array.
When the interval function executes every 5 seconds, it should re-populate
the page with all of the articles in the array at that time.
So if a new news item has been submitted via the form and added to the

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Channel</title>
</head>
<body>
     <!-- form to add a news item -->
    <form id="news-form">
        <input type="text" id="title-input" placeholder="Title" />
        <input type="text" id="content-input" placeholder="Content" />
        <button type="submit">Add News</button>
    </form>

    <button id="stop-btn">Stop auto-refresh</button>

    <!-- template: the reusable markup for ONE news item -->
    <template id="news-template">
        <div class="news-item">
            <h2 class="news-title"></h2>
            <p class="news-content"></p>
        </div>
    </template>

    <!-- container: JS clears this and refills it each cycle -->
    <div id="news-list"></div>

<script>

let news = [
{ id: 1, title: "Election Results", content: "Newly elected minister..." },
{ id: 2, title: "Sporting Success", content: "World Cup winners..." },
{ id: 3, title: "Tornado Warning", content: "Residents should prepare..." },
];

function renderNews() {
    const container = document.getElementById("news-list");
    container.innerHTML = ""; // 1. clear the container so we don't stack duplicates each cycle
    news.forEach((item) => { // 2. rebuild one item per news object
        const clone = document.getElementById("news-template").content.cloneNode(true);
        clone.querySelector(".news-title").innerText = item.title;
        clone.querySelector(".news-content").innerText = item.content;
        container.appendChild(clone);
    });
}

// --- Part 2: add news via the form ---
const form = document.getElementById("news-form");
form.addEventListener("submit", (event) => {
    event.preventDefault();                                   // stop the page reload

    const title = document.getElementById("title-input").value;
    const content = document.getElementById("content-input").value;
    if (!title || !content) return;                           // skip empty submits

    // build the new object and push it into the array
    news.push({ id: news.length + 1, title: title, content: content });

    form.reset();                                             // clear the inputs
    renderNews();                                             // show it instantly (don't wait up to 5s)
});

// --- Extension: stop button ---
const intervalId = setInterval(renderNews, 5000);             // save the id so I can cancel it
document.getElementById("stop-btn").addEventListener("click", () => {
    clearInterval(intervalId);
});


renderNews();                        // show immediately on load
// setInterval(renderNews, 5000);       // then re-sync every 5 seconds

</script>
</body>
</html>
